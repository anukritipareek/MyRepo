name: Salesforce Validation to QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - qa
    paths:
      - 'force-app/**'

permissions:
  contents: write
  actions: read
    
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install SGD Plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate with Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default --alias qa-org
          rm auth_url.txt

      - name: Generate Delta Package (PR)
        run: |
          mkdir changed-sources
          sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" \
            --output changed-sources --generate-delta --source force-app
      
      - name: Debug delta structure
        run: |
          echo "Listing changed-sources:"
          ls -R changed-sources
          
      - name: Debug package.xml
        run: |
          echo "----- package.xml -----"
          cat changed-sources/package/package.xml
  
      # APEX TEST CLASS IDENTIFICATION

      - name: Identify Apex Test Classes
        run: |
          chmod +x ./scripts/map_tests.sh
          ./scripts/map_tests.sh

      # STAGE 6: INTUAT ENVIRONMENT VALIDATION

      - name: QA QUALITY GATE VALIDATION
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.base_ref || github.ref_name }}
        run: |
          set -e
          echo "🚀 Running QA Environment Quality Gates Validation"
          chmod +x ./scripts/validate_deployment.sh
          if ./scripts/validate_deployment.sh; then
            echo "✅ QA Quality Gates passed successfully"
          else
            echo "❌ QA Quality Gates failed"
          fi